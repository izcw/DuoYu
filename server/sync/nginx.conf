server {
    listen 80;
    server_name sync.duoyu.link;
    return 301 https://sync.duoyu.link$request_uri;
}
server {
    listen 443 ssl;
    server_name sync.duoyu.link;
    ssl_certificate /www/server/panel/vhost/cert/duoyu.link/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/duoyu.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:5260;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_cache off;
    }
    access_log /www/wwwlogs/duoyu-sync-access.log;
    error_log /www/wwwlogs/duoyu-sync-error.log;
}
